# staging-secrets.yaml
# Replace the placeholders with your actual secret values before applying
apiVersion: v1
kind: Secret
metadata:
  name: cryptocurrency-staging-env
  namespace: staging
type: Opaque
stringData:
  ENV: "staging"
  # Server
  PORT: "5000"
  # Database configuration (individual variables)
  DB_HOST: "10.10.224.10"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASSWORD: "@Admin123"
  DB_NAME: "cryptocurrency"
  DB_SSLMODE: "require"
  # Alchemy configuration
  ALCHEMY_NOTIFY_API_KEY: "your-alchemy-notify-api-key-here"
  ALCHEMY_WEBHOOK_SIGNING_KEY: "your-webhook-signing-key-here"
  WEBHOOK_BASE_URL: "https://your-domain.com"
