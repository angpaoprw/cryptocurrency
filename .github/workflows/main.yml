name: deploy-staging-cryptocurrency

on:
  push:
    branches:
      - staging
    paths:
      - "**"
env:
  TAG_VERSION: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/checkout@v3
      - name: Setup .netrc
        run: |
          echo "machine github.com login ${{ secrets.GH_USERNAME }} password ${{ secrets.GH_PASSWORD }}" > ~/.netrc
          chmod 600 ~/.netrc
          ls -la ~
      - run: cp ~/.netrc ./
      - run: docker build -t angpaoprw/staging-tpl-cryptocurrency:$TAG_VERSION .
      - run: docker push angpaoprw/staging-tpl-cryptocurrency:$TAG_VERSION
      - uses: google-github-actions/get-gke-credentials@v0.2.1
        with:
          cluster_name: tplpoker
          location: asia-southeast1-a
          credentials: ${{ secrets.GKE_CREDENTIAL }}

      - name: Set image on deployment
        run: kubectl set image deployment/cryptocurrency-depl cryptocurrency=angpaoprw/staging-tpl-cryptocurrency:$TAG_VERSION -n staging

      - name: rollout deployment
        run: kubectl rollout restart deploy/cryptocurrency-depl -n staging
